version: 2

sources:
  - name: silver
    description: 수집기(pipelines/ingest)가 쓰는 정제 테이블. dbt는 읽기만 한다.
    tables:
      - name: teams
      - name: matches
      - name: match_revisions
        description: 경기 내용의 버전. 수정·삭제는 DB 트리거가 막는다.
      - name: live_match_revisions
        description: football-data.org 경기 상태·점수의 버전(Kafka 소비자가 씀).
      - name: odds_revisions
        description: 배당의 버전(football-data.co.uk). 수정·삭제는 DB 트리거가 막는다.
      - name: match_stats_revisions
        description: 경기 기록(슈팅·유효 슈팅·퇴장)의 버전(football-data.co.uk, 3g). 수정·삭제는 DB 트리거가 막는다.
