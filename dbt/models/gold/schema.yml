version: 2

models:
  - name: stg_matches_known
    description: 기준 시각에 알려진 경기별 최신 정보(football-data.org 우선, 없으면 openfootball)와 팀 이름
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["SCHEDULED", "LIVE", "FINISHED", "AWARDED", "NOT_PLAYED"]
      - name: fixture_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["openfootball", "football-data-org"]

  - name: team_match_results
    description: 끝난 경기를 팀 관점 2행으로 펼친 테이블
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["match_id", "venue"]
    columns:
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ["W", "D", "L"]
      - name: goals_for
        data_tests: [not_null]
      - name: points
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
                quote: false

  - name: league_standings
    description: 리그·시즌별 순위표
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["competition_code", "season", "team"]
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["competition_code", "season", "position"]
    columns:
      - name: points
        data_tests: [not_null]

  - name: match_odds_1x2
    description: 경기 × 북메이커 × 시점별 1X2(홈·무·원정) 배당과 정규화 내재 확률(시장 기준선)
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["match_id", "bookmaker", "timing"]
    columns:
      - name: timing
        data_tests:
          - accepted_values:
              arguments:
                values: ["PRE_MATCH", "CLOSING"]
      - name: price_home
        data_tests: [not_null]

  - name: match_stats
    description: 끝난 경기의 기록(슈팅·유효 슈팅·퇴장, 3g). 경기 후 기록이라 대상 경기보다 앞서 끝난 경기의 것만 모델 입력이 된다
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: home_shots_on_target
        data_tests: [not_null]
      - name: away_shots_on_target
        data_tests: [not_null]

  - name: match_features_pit
    description: 시간순 학습·평가 데이터셋. 경기마다 시작 전에 알 수 있던 결과만으로 만든 팀 특징, 시장 기준선, 결과(과거 재구성 가정)
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["HISTORICAL_RECONSTRUCTION"]
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ["HOME", "DRAW", "AWAY"]

  # 6a: NBA
  - name: stg_games_known
    description: 기준 시각에 알려진 NBA 경기별 최신 정보와 팀 이름
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["SCHEDULED", "IN_PROGRESS", "FINISHED", "POSTPONED"]

  - name: nba_team_game_results
    description: 끝난 NBA 경기를 팀 관점 2행으로 펼친 테이블(무승부 없음)
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["game_id", "venue"]
    columns:
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ["W", "L"]
      - name: points_for
        data_tests: [not_null]

  - name: nba_standings
    description: NBA 시즌별 정규 시즌 순위(승률 → 득실 차 → 팀 이름)
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["competition_code", "season", "team"]
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["competition_code", "season", "position"]

  - name: nba_game_odds_h2h
    description: NBA 경기 × 소스 × 북메이커별 승패 배당과 정규화 내재 확률
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: ["game_id", "source_id", "bookmaker"]
    columns:
      - name: prob_home
        data_tests: [not_null]
