# 로컬 데이터 플랫폼(로드맵 1a): PostgreSQL(Silver) + SeaweedFS S3(Bronze)
# 실행: docker compose --env-file .env -f infra/docker-compose.yml up -d
# 모든 포트는 127.0.0.1에만 열어 외부 네트워크에서 접속할 수 없게 한다.
# 계정 정보는 .env(Git 제외)에서 읽는다. .env는 python -m pipelines.config init-env로 만든다.
#
# 객체 저장소를 MinIO 대신 SeaweedFS로 쓰는 이유: MinIO 커뮤니티판은 Docker Hub 이미지가 내려가고
# 저장소가 보관(archived) 상태가 되었다. 코드는 표준 S3 API(boto3)만 쓰므로 다른 S3 호환 저장소로 바꿔도 된다.
name: sports-prediction

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run python -m pipelines.config init-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python -m pipelines.config init-env}
      POSTGRES_DB: ${POSTGRES_DB:-sports}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  object-store:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run python -m pipelines.config init-env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run python -m pipelines.config init-env}
    # 시작할 때 환경 변수로 S3 계정 설정 파일을 만든 뒤 master·volume·filer·S3를 한 컨테이너로 띄운다.
    # SeaweedFS는 버킷마다 볼륨을 여러 개 잡는다. 기본 상한(8개)으로는 버킷 2개만 만들어도 쓰기가 실패하므로
    # 볼륨 수는 디스크 여유에 맞춰 자동 계산(-volume.max=0)하고, 볼륨 하나는 256MB로 작게 둔다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"pipeline","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-59000}:8333"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 이벤트 스트리밍(로드맵 2a). ZooKeeper 없는 KRaft 단일 노드(브로커 + 컨트롤러).
  # 리스너: INTERNAL(컨테이너끼리, kafka:9092), EXTERNAL(이 PC에서, 127.0.0.1:59092), CONTROLLER(내부 합의용).
  # 토픽 자동 생성은 끄고, 파이프라인이 정해진 설정(파티션 수 등)으로 직접 만든다(pipelines/streaming/kafka_io.py).
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-59092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # --- 상시 실행 스트리밍 서비스(로드맵 2단계). --profile streaming을 줄 때만 실행한다. ---
  # football-data.org 수집기: 경기 상황에 맞춘 간격(경기 중 2분, 경기일 15분, 평소 6시간)으로 조회해 Kafka로 보낸다.
  fdorg-poller:
    build:
      context: ..
      dockerfile: infra/pipeline/Dockerfile
    image: sports-prediction-pipeline:0.1
    profiles: ["streaming"]
    command: ["python", "-m", "pipelines.ingest.football_data_org"]
    environment: &pipeline-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sports}
      S3_ENDPOINT_URL: http://object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
      KAFKA_BOOTSTRAP: kafka:9092
      FOOTBALL_DATA_ORG_API_KEY: ${FOOTBALL_DATA_ORG_API_KEY:-}
    volumes:
      - ../pipelines:/opt/project/pipelines:ro
    depends_on: &pipeline-deps
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # --- Spark 작업(로드맵 4a). --profile spark로 한 번 실행하고 끝난다: Gold → Parquet → Spark → 대조. ---
  # 수집 API 키는 넘기지 않는다(이 작업에 필요 없음). 테스트도 이 컨테이너에서 돌 수 있게 tests를 읽기 전용으로 연결한다.
  spark-features:
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
    image: sports-prediction-spark:4.1.3
    profiles: ["spark"]
    command: ["python", "-m", "pipelines.lake.run", "all"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sports}
      S3_ENDPOINT_URL: http://object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKE_BUCKET: ${LAKE_BUCKET:-lake}
    volumes:
      - ../pipelines:/opt/project/pipelines:ro
      - ../tests:/opt/project/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    restart: "no"

  # Kafka 소비자: 경기 이벤트를 Silver(live_match_revisions)에 반영한다. 오프셋은 DB 커밋 뒤에 커밋한다.
  stream-consumer:
    image: sports-prediction-pipeline:0.1
    profiles: ["streaming"]
    command: ["python", "-m", "pipelines.streaming.match_consumer"]
    environment: *pipeline-env
    volumes:
      - ../pipelines:/opt/project/pipelines:ro
    depends_on: *pipeline-deps
    restart: unless-stopped

  # --- 아래는 오케스트레이션(로드맵 1d). 무거워서 --profile airflow를 줄 때만 실행한다. ---
  # Airflow 메타데이터용 데이터베이스(airflow)를 한 번만 만든다. 이미 있으면 아무것도 하지 않는다.
  airflow-db-init:
    image: postgres:16.4
    profiles: ["airflow"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-sports}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1
        || psql -c "CREATE DATABASE airflow"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 개발용 단일 컨테이너 Airflow(standalone: 스케줄러·API 서버·DAG 처리기를 한 번에 실행).
  airflow:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    image: sports-prediction-airflow:3.3.2
    profiles: ["airflow"]
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      # 파이프라인 코드가 컨테이너 네트워크 주소로 접속하도록 덮어쓴다(pipelines/config.py).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sports}
      S3_ENDPOINT_URL: http://object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
      LAKE_BUCKET: ${LAKE_BUCKET:-lake}
      # 텔레그램 알림(선택). 비어 있으면 알림만 건너뛴다.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-58080}:8080"
    volumes:
      - ../dags:/opt/project/dags
      - ../pipelines:/opt/project/pipelines
      - ../dbt:/opt/project/dbt
      # 사용자가 직접 내려받은 CSV를 넣는 폴더. 읽기만 하므로 읽기 전용으로 연결한다.
      - ../data/landing:/opt/project/data/landing:ro
      - airflow-home:/opt/airflow
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  object-store-data:
  kafka-data:
  airflow-home:
