# Kafka 소비자 → Silver. 같은 소비자 그룹이라 여러 개를 띄우면 파티션을 나눠 갖지만(fdorg.matches.v1은 3개),
# 지금 양에는 하나로 충분하다. 오프셋은 DB 커밋 뒤에 커밋하므로 파드가 바뀌어도 결과는 같다(최소 한 번 + 멱등).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: sports-prediction-pipeline-app:0.1
          imagePullPolicy: Never
          command: ["python", "-m", "pipelines.streaming.match_consumer"]
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: pipeline-secrets
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
