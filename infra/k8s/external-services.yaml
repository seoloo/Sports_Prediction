# 클러스터 밖에서 도는 저장소(Postgres·Kafka·SeaweedFS)를 클러스터 안 이름으로 쓰게 하는 Service.
# 선택자(selector)가 없어서 쿠버네티스가 엔드포인트를 만들지 않는다. 주소는 EndpointSlice로 따로 넣는다
# (로컬: scripts/k8s_local.py가 compose 컨테이너 주소로, 미니 PC·다른 환경: 그 환경의 주소로).
# Kafka는 브로커가 "kafka:9092"를 광고(advertised listener)하므로 Service 이름도 kafka여야 한다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
    - name: kafka
      port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
spec:
  ports:
    - name: s3
      port: 8333
